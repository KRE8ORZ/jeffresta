<style>

body{
    margin:0;
    background:#ffffff;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    user-select:none;
    -webkit-user-select:none;
}

header{
    text-align:center;
    padding:8px 20px 5px;
}

h1{
    margin:0 0 4px 0;
    font-size:2rem;
    font-weight:300;
    letter-spacing:.15em;
}

nav{
    margin:0;
}

nav a{
    color:#333;
    text-decoration:none;
    margin:0 5px;
    font-size:.9rem;
}

nav a:hover{
    color:#000;
}

.separator{
    color:#777;
    margin:0 4px;
}

.gallery-wrapper{
    position:relative;
    width:100%;
    margin-top:5px;
}

.gallery{
    display:flex;
    align-items:flex-start;
    gap:0;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    scrollbar-width:none;
}

.gallery::-webkit-scrollbar{
    display:none;
}

.gallery img{
    height:755px;
    width:auto;
    display:block;
    flex-shrink:0;
    -webkit-user-drag:none;
    user-select:none;
}

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:42px;
    border:none;
    cursor:pointer;
    background:rgba(255,255,255,.90);
    color:#333;
    font-size:24px;
    z-index:100;
}

.arrow:hover{
    background:#ffffff;
    color:#000;
}

.arrow-left{
    left:15px;
}

.arrow-right{
    right:15px;
}

.bottom-text{
    text-align:center;
    margin-top:15px;
}

.bottom-text h2{
    font-size:1rem;
    font-weight:300;
    color:#444;
    margin:0 0 8px 0;
}

.bottom-text p{
    font-size:.9rem;
    color:#555;
    margin:0;
    line-height:1.5;
}

.footer{
    text-align:center;
    color:#666;
    font-size:.8rem;
    margin-top:12px;
    margin-bottom:20px;
}

@media (max-width:1200px){

.gallery img{
    height:635px;
}

}

@media (max-width:768px){

h1{
    font-size:1.6rem;
}

nav a{
    display:inline-block;
    margin:4px 4px;
}

.separator{
    display:none;
}

.gallery img{
    height:420px;
}

.arrow{
    display:none;
}

}

</style>
</head>
<body>

<main>

<header>

<h1>JEFF RESTA</h1>

<nav aria-label="Primary navigation">
<a href="index.html">Home</a>
<span class="separator" aria-hidden="true">•</span>

<a href="concert.html">Concert Photography</a>
<span class="separator" aria-hidden="true">•</span>

<a href="ballet.html">Ballet Photography</a>
<span class="separator" aria-hidden="true">•</span>

<a href="performing-arts.html">Performing Arts Photography</a>
<span class="separator" aria-hidden="true">•</span>

<a href="ballet-art.html" aria-current="page">Ballet Art</a>
<span class="separator" aria-hidden="true">•</span>

<a href="about.html">About</a>
</nav>

</header>

<div class="gallery-wrapper">

<button class="arrow arrow-left" type="button" aria-label="Previous images" onclick="scrollGallery(-900)">‹</button>

<div class="gallery" id="gallery"></div>

<button class="arrow arrow-right" type="button" aria-label="Next images" onclick="scrollGallery(900)">›</button>

</div>

<div class="bottom-text">
<h2>Ballet Art</h2>
<p>
Fine art ballet photography exploring movement, form, light and composition through dance-inspired imagery.
</p>
</div>

<div class="footer">
© 2027 Jeff Resta Photography
</div>

</main>

<script>

document.addEventListener('contextmenu', function(e){
    e.preventDefault();
});

document.addEventListener('dragstart', function(e){
    e.preventDefault();
});

document.addEventListener('selectstart', function(e){
    e.preventDefault();
});

document.addEventListener('keydown', function(e){

    const key = e.key.toLowerCase();

    if(
        (e.metaKey && key === 's') ||
        (e.ctrlKey && key === 's')
    ){
        e.preventDefault();
    }

    if(
        key === 'f12' ||
        (e.ctrlKey && e.shiftKey && key === 'i') ||
        (e.ctrlKey && e.shiftKey && key === 'j') ||
        (e.ctrlKey && e.shiftKey && key === 'c') ||
        (e.metaKey && e.altKey && key === 'i')
    ){
        e.preventDefault();
    }

});

const gallery = document.getElementById('gallery');

const images = [

{
    src:"images/ballet-art/Ballet_Art_01.jpg",
    alt:"Fine art ballet photograph exploring movement and form."
},
{
    src:"images/ballet-art/Ballet_Art_02.jpg",
    alt:"Artistic ballet image emphasizing composition, light and motion."
},
{
    src:"images/ballet-art/Ballet_Art_03.jpg",
    alt:"Dance-inspired fine art photograph created by Jeff Resta."
}

];

images.forEach(image => {

    const img = document.createElement('img');

    img.src = image.src;
    img.alt = image.alt;
    img.draggable = false;

    gallery.appendChild(img);

});

function scrollGallery(amount){

    gallery.scrollBy({
        left: amount,
        behavior: 'smooth'
    });

}

gallery.addEventListener('wheel', function(e){

    e.preventDefault();
    gallery.scrollLeft += e.deltaY;

},{ passive:false });

document.addEventListener('keydown', function(e){

    if(e.key === 'ArrowRight'){
        scrollGallery(900);
    }

    if(e.key === 'ArrowLeft'){
        scrollGallery(-900);
    }

});

</script>

</body>
</html>
