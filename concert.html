<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Jeff Resta | Concert Photography</title>

<style>

body{
    margin:0;
    background:#ffffff;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}

header{
    text-align:center;
    padding:8px 20px 5px;
}

h1{
    margin:0 0 4px 0;
    font-size:2rem;
    font-weight:300;
    letter-spacing:.15em;
}

nav{
    margin:0;
}

nav a{
    color:#555;
    text-decoration:none;
    margin:0 5px;
    font-size:.9rem;
}

nav a:hover{
    color:#000;
}

.separator{
    color:#c5c5c5;
    margin:0 4px;
}

.gallery-wrapper{
    position:relative;
    width:100%;
    margin-top:5px;
}

.gallery{
    display:flex;
    align-items:center;
    gap:0;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-behavior:smooth;
    scrollbar-width:none;
}

.gallery::-webkit-scrollbar{
    display:none;
}

.gallery img{
    height:650px;
    width:auto;
    display:block;
    flex-shrink:0;
}

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:42px;
    border:none;
    cursor:pointer;
    background:rgba(255,255,255,.9);
    color:#333;
    font-size:24px;
    z-index:100;
}

.arrow:hover{
    background:#ffffff;
}

.arrow-left{
    left:15px;
}

.arrow-right{
    right:15px;
}

@media (max-width:1200px){

.gallery img{
    height:550px;
}

}

@media (max-width:768px){

h1{
    font-size:1.6rem;
}

nav a{
    display:inline-block;
    margin:4px 4px;
}

.separator{
    display:none;
}

.gallery img{
    height:420px;
}

.arrow{
    display:none;
}

}

</style>
</head>

<body>

<header>

<h1>JEFF RESTA</h1>

<nav>

<a href="index.html">Home</a>
<span class="separator">•</span>

<a href="concert.html">Concert Photography</a>
<span class="separator">•</span>

<a href="ballet.html">Ballet Photography</a>
<span class="separator">•</span>

<a href="performing-arts.html">Performing Arts Photography</a>
<span class="separator">•</span>

<a href="ballet-art.html">Ballet Art</a>
<span class="separator">•</span>

<a href="about.html">About</a>

</nav>

</header>

<div class="gallery-wrapper">

<button class="arrow arrow-left" onclick="scrollGallery(-900)">
‹
</button>

<div class="gallery" id="gallery">

<img src="images/concert/Alicia_Keys_IMG_2884.jpg" alt="">
<img src="images/concert/Billy_Idol_IMG_1104.jpg" alt="">
<img src="images/concert/Black_Label_Society_Zakk_Wylde_IMG_5611.jpg" alt="">
<img src="images/concert/Chris_Cornell_IMG_1502.jpg" alt="">
<img src="images/concert/David_Grey_IMG_7748.jpg" alt="">
<img src="images/concert/Deftones_IMG_4112.jpg" alt="">
<img src="images/concert/Linkin_Park_Chester_Bennington_IMG_0134.jpg" alt="">
<img src="images/concert/Rob_Zombie_IMG_4884.jpg" alt="">
<img src="images/concert/Roger_Waters_IMG_6152.jpg" alt="">
<img src="images/concert/Soundgarden_IMG_1243.jpg" alt="">

</div>

<button class="arrow arrow-right" onclick="scrollGallery(900)">
›
</button>

</div>

<script>

const gallery = document.getElementById('gallery');

function scrollGallery(amount){
    gallery.scrollBy({
        left: amount,
        behavior: 'smooth'
    });
}

gallery.addEventListener('wheel', function(e){
    e.preventDefault();
    gallery.scrollLeft += e.deltaY;
});

document.addEventListener('keydown', function(e){

    if(e.key === 'ArrowRight'){
        scrollGallery(900);
    }

    if(e.key === 'ArrowLeft'){
        scrollGallery(-900);
    }

});

</script>

</body>
</html>
