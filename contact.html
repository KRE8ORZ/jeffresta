<style>

body{
    margin:0;
    background:#ffffff;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}

.container{
    max-width:1150px;
    margin:0 auto;
    padding:8px 20px 30px;
}

header{
    text-align:center;
    margin-bottom:8px;
}

h1{
    margin:0 0 4px 0;
    font-size:2rem;
    font-weight:300;
    letter-spacing:.15em;
}

nav{
    margin:0 0 5px 0;
}

nav a{
    color:#333;
    text-decoration:none;
    margin:0 5px;
    font-size:.9rem;
}

nav a:hover{
    color:#000;
}

.separator{
    color:#777;
    margin:0 4px;
}

.contact-wrapper{
    max-width:640px;
    margin:60px auto 80px;
}

.contact-wrapper h2{
    font-size:1.1rem;
    font-weight:300;
    margin:0 0 20px 0;
    text-align:center;
    color:#444;
}

.contact-wrapper p{
    color:#333;
    line-height:1.7;
    margin:0 0 25px 0;
}

.contact-form{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.contact-form label{
    font-size:.9rem;
    color:#444;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    box-sizing:border-box;
    border:1px solid #d0d0d0;
    padding:12px;
    font-size:.95rem;
    font-family:inherit;
    background:#fff;
    color:#111;
}

.contact-form input:focus,
.contact-form textarea:focus{
    outline:none;
    border-color:#777;
}

.contact-form textarea{
    min-height:180px;
    resize:vertical;
}

.contact-form button{
    width:140px;
    padding:12px 20px;
    border:1px solid #333;
    background:#fff;
    color:#111;
    cursor:pointer;
    font-size:.9rem;
    font-family:inherit;
}

.contact-form button:hover{
    background:#111;
    color:#fff;
}

.alternate-contact{
    margin-top:35px;
    text-align:center;
    color:#555;
    font-size:.9rem;
    line-height:1.6;
}

.bottom-text{
    text-align:center;
    margin-top:15px;
}

.bottom-text h2{
    font-size:1rem;
    font-weight:300;
    color:#444;
    margin:0 0 8px 0;
}

.bottom-text p{
    font-size:.9rem;
    color:#555;
    margin:0;
    line-height:1.5;
}

.footer{
    text-align:center;
    color:#666;
    font-size:.8rem;
    margin-top:12px;
}

@media (max-width:768px){

h1{
    font-size:1.6rem;
}

nav a{
    display:inline-block;
    margin:4px 4px;
}

.separator{
    display:none;
}

.container{
    padding:8px 10px 20px;
}

.contact-wrapper{
    margin:25px auto 40px;
}

}
