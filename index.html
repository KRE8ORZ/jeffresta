<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fafaf8;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.wrapper {
    max-width: 1400px;
    width: 92%;
    margin: 0 auto;
}

header {
    text-align: center;
    padding: 50px 0 40px;
}

h1 {
    font-size: 2.5rem;
    font-weight: 300;
    letter-spacing: .18em;
    margin-bottom: 20px;
}

.tagline {
    font-size: 1.7rem;
    font-weight: 300;
    color: #444;
    margin-bottom: 14px;
}

.subtagline {
    font-size: 1rem;
    color: #777;
    margin-bottom: 35px;
}

nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 28px;
}

nav a {
    text-decoration: none;
    color: #555;
    font-size: .95rem;
}

nav a:hover {
    color: #000;
}

.hero-top {
    margin-bottom: 20px;
}

.hero-top img {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
}

.hero-bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.hero-bottom img {
    width: 100%;
    display: block;
    aspect-ratio: 2 / 3;
    object-fit: cover;
}

.hero a {
    display: block;
}

footer {
    text-align: center;
    color: #888;
    font-size: .85rem;
    padding: 60px 0;
}

@media (max-width: 900px) {

.hero-bottom {
    grid-template-columns: 1fr;
}

h1 {
    font-size: 2rem;
}

.tagline {
    font-size: 1.3rem;
}

nav ul {
    gap: 14px;
}

}

</style>
</head>

<body>

<div class="wrapper">

<header>

<h1>JEFF RESTA</h1>

<div class="tagline">
    Concert, Ballet &amp; Performing Arts Photography
</div>

<div class="subtagline">
    Promoting Music &amp; The Performing Arts through Photography &amp; Media.
</div>

<nav>
<ul>

</nav>

</a>
</div>

<div class="hero-bottom">

<a href="ballet.html">
<img src="images/hero/TBT_IMG_2842.jpg" alt="Ballet Photography">
</a>

<a id="rightSideLink" href="">
<img id="rightSideImage" src="" alt="">
</a>

</div>

</section>

<footer>
© 2027 Jeff Resta Photography
</footer>

</div>

<script>

const concertImages = [

"images/hero/Alicia_Keys_IMG_2884.jpg",
"images/hero/Billy_Idol_IMG_1104.jpg",
"images/hero/Black_Label_Society_Zakk_Wylde_IMG_5611.jpg",
"images/hero/Chris_Cornell_IMG_1502.jpg",
"images/hero/David_Grey_IMG_7748.jpg",
"images/hero/Deftones_IMG_4112.jpg",
"images/hero/Linkin_Park_Chester_Bennington_IMG_0134.jpg",
"images/hero/Rob_Zombie_IMG_4884.jpg",
"images/hero/Roger_Waters_IMG_6152.jpg",
"images/hero/Soundgarden_IMG_1243.jpg"

];

const randomConcert =
concertImages[Math.floor(Math.random() * concertImages.length)];

document.getElementById("concertHero").src = randomConcert;

const rightSideOptions = [

{
image: "images/hero/Kooza_IMG_7756.jpg",
link: "performing-arts.html"
},

{
image: "images/hero/IMG_3022_Ballet_Art.jpg",
link: "ballet-art.html"
}

];

const randomRight =
rightSideOptions[Math.floor(Math.random() * rightSideOptions.length)];

document.getElementById("rightSideImage").src = randomRight.image;
document.getElementById("rightSideLink").href = randomRight.link;

</script>

</body>
</html>
